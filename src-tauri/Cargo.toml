[package]
name = "codex-themes-desktop"
version = "0.1.5"
description = "A third-party graphical theme manager for the Codex desktop application"
authors = ["Codex Themes contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "codex_themes_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-log = "2"
rfd = "0.15"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
